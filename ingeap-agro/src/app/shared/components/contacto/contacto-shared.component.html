<div class="contact-form-wrapper overflow-hidden w-full max-w-7xl mx-auto px-4 py-8"
     [style.--accent-color]="accentColor"
     [style.--accent-color-hover]="accentColorHover">
  
    <div class="text-center mb-6">
        <div *ngIf="eyebrowText || eyebrowNumber" 
             class="eyebrow inline-flex align-items-center justify-content-center font-bold px-3 py-1 border-round-3xl mb-3">
            <span *ngIf="eyebrowNumber" class="num mr-2">{{ eyebrowNumber }}</span> {{ eyebrowText }}
        </div>
        <h2 class="text-5xl font-bold mb-2 text-900"><em>{{ title }}</em></h2>
        <p class="text-xl text-600" *ngIf="subtitle">{{ subtitle }}</p>
    </div>

    <div class="bg-white border-round-2xl shadow-2 p-4 md:p-6 lg:p-8 relative">
        <div class="grid grid-nogutter overflow-hidden">
            <!-- Formulario -->
            <div class="col-12 md:col-6 p-0 md:pr-6 mb-6 md:mb-0">
                <form class="p-fluid" (ngSubmit)="enviarMail()">
                    <div class="field mb-4">
                        <label for="name" class="font-semibold text-900">Nombre</label>
                        <input type="text" id="name" name="name" pInputText [(ngModel)]="formData.name" style="border-radius: 8px;" />
                    </div>
                    <div class="field mb-4">
                        <label for="email" class="font-semibold text-900">Email</label>
                        <input type="email" id="email" name="email" pInputText [(ngModel)]="formData.email" style="border-radius: 8px;" />
                    </div>
                    <div class="field mb-5">
                        <label for="comentario" class="font-semibold text-900">Comentario</label>
                        <textarea name="message" id="comentario" rows="6" pInputTextarea [(ngModel)]="formData.message" style="border-radius: 8px; resize: none;"></textarea>
                    </div>
                    <div class="field flex justify-content-between align-items-center gap-3">
                        <button type="button" pButton label="BORRAR" class="p-button-outlined p-button-secondary w-auto flex-grow-1" (click)="limpiarFormulario()" style="border-radius: 8px; font-weight: 600;"></button>
                        <button type="submit" pButton [label]="isSending ? 'ENVIANDO...' : buttonLabel" [disabled]="isSending" class="w-auto flex-grow-1 submit-btn" style="border-radius: 8px; font-weight: 600;"></button>
                    </div>
                </form>
            </div>

            <!-- Información de Contacto y Mapa -->
            <div class="col-12 md:col-6 surface-50 p-4 md:p-6 flex flex-column justify-content-center align-items-center text-center border-round-xl">
                <h3 class="text-900 text-2xl font-bold mb-3 contact-info-title">Información de Contacto</h3>
                <div class="text-lg text-600 line-height-3 mx-auto mb-4" style="max-width:300px;">
                    <p class="m-0 flex align-items-center justify-content-center gap-2">
                        <i class="pi pi-map-marker text-2xl" style="color: var(--accent-color);"></i>
                        <span>{{ address }}</span>
                    </p>
                    <p class="m-0 mt-2 flex align-items-center justify-content-center gap-2" *ngIf="email">
                        <i class="pi pi-envelope text-xl" style="color: var(--accent-color);"></i>
                        <span>{{ email }}</span>
                    </p>
                    <p class="m-0 mt-2 flex align-items-center justify-content-center gap-2" *ngIf="phone">
                        <i class="pi pi-phone text-xl" style="color: var(--accent-color);"></i>
                        <span>{{ phone }}</span>
                    </p>
                </div>
                <div class="w-full border-round-xl overflow-hidden shadow-2 map-container" style="height: 350px;">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d665.8578086635927!2d-71.2286226!3d-32.876881!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9689d89a2f3f7e8f%3A0x0!2zMzLCsDUyJzM2LjgiUyA3McKwMTMnNDMuMCJX!5e0!3m2!1ses!2sus!4v1697988269871!5m2!1ses!2sus" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </div>
</div>
