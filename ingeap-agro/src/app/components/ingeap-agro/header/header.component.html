<nav class="nav">
  <div class="nav-inner">

    <a (click)="navegarIngeap()" class="brand" style="cursor: pointer;">

      } @else {
        <!-- Ajusta el nombre de la imagen de tu logo normal aquí -->
        <img src="../../../../assets/ingeap/logo.png" alt="Ingeap Servicios">
      }
    </a>

    <div class="brand-switcher">
      <a (click)="navegarSalas()" class="seg-item sec" style="cursor: pointer;"><span class="sw"></span>Salas El.</a>

      <a (click)="navegarIngeapAgro()" class="seg-item agro" [class.active]="router.url.includes('/agro')" style="cursor: pointer;"><span class="sw"></span>Agro</a>

    @if (router.url.includes('/agro')) {
      <div class="nav-links">

        <a (click)="navigateToFragment('beneficios')" style="cursor: pointer;">Beneficios</a>
        <a (click)="router.navigate(['/agro/contacto'])" style="cursor: pointer;">Contacto</a>
        <a (click)="Login()" class="btn btn-primary" style="cursor: pointer; background-color: var(--ink-950, #0a0e1a); border-color: var(--ink-950, #0a0e1a); color: white;">Login</a>
      </div>
    } @else {
      <div class="nav-links">
        <a (click)="router.navigate(['/home'], { fragment: 'historia' })" style="cursor: pointer;">Historia</a>
