<div class="header-bar py-3 px-4 md:px-6 lg:px-8 flex align-items-center justify-content-between relative">

    <!-- Logo -->
    <a (click)="navegarLogo()" class="cursor-pointer flex align-items-center">
        <img [src]="logoSrc" [alt]="logoAlt" style="height: 40px;" class="mr-0 lg:mr-4">
    </a>

    <!-- Selector de Divisiones (Desktop) -->
    <div class="hidden lg:flex align-items-center p-1 border-round-3xl surface-200">
        <a (click)="navegarSalas()" class="cursor-pointer px-4 py-2 border-round-3xl text-sm font-bold transition-all text-decoration-none" [ngClass]="isActive('salas_electricas') ? 'text-900 bg-white shadow-1' : 'text-600 hover:text-900 transition-colors'" [style]="isActive('salas_electricas') ? 'color: ' + getActiveTabColor('salas_electricas') + ' !important' : ''">Salas Eléctricas</a>
        <a (click)="navegarIngeap()" class="cursor-pointer px-4 py-2 border-round-3xl text-sm font-bold transition-all text-decoration-none" [ngClass]="isActive('home') || (!isActive('salas_electricas') && !isActive('agro')) ? 'text-900 bg-white shadow-1' : 'text-600 hover:text-900 transition-colors'" [style]="(isActive('home') || (!isActive('salas_electricas') && !isActive('agro'))) ? 'color: ' + getActiveTabColor('home') + ' !important' : ''">Ingeap Servicios</a>
        <a (click)="navegarIngeapAgro()" class="cursor-pointer px-4 py-2 border-round-3xl text-sm font-bold transition-all text-decoration-none" [ngClass]="isActive('agro') ? 'text-900 bg-white shadow-1' : 'text-600 hover:text-900 transition-colors'" [style]="isActive('agro') ? 'color: ' + getActiveTabColor('agro') + ' !important' : ''">Ingeap Agro</a>
    </div>

    <!-- Navegación y CTA (Desktop) -->
    <div class="hidden xl:flex align-items-center gap-3">
        <a
            *ngFor="let item of menuActual"
            (click)="navigateToMenuItem(item)"
            class="cursor-pointer text-700 hover:text-900 font-medium transition-colors text-decoration-none">

            {{ item.label }}

        </a>
        <!-- Botón permanente -->
        <button
            pButton
            label="Hablemos"
            class="p-button-rounded border-none px-4 py-2 font-bold"
            [style.background-color]="activeColor"
            (click)="navegarContacto()">
        </button>

    </div>


    <!-- Botón Menú Móvil Hamburger -->
    <a class="cursor-pointer lg:hidden text-700 hover:text-900 transition-colors" (click)="toggleMobileMenu()">
        <i class="pi" [ngClass]="mobileMenuActive ? 'pi-times' : 'pi-bars'" style="font-size: 1.5rem;"></i>
    </a>
</div>

<!-- Menú Móvil Desplegable -->
<div *ngIf="mobileMenuActive" class="lg:hidden flex flex-column absolute top-100 z-5 p-4 gap-4 mobile-menu-dropdown">
    <!-- Selector de divisiones en móvil -->
    <div class="mobile-divisions">

    <span class="mobile-divisions-title">
        NUESTRAS DIVISIONES
    </span>

    <!-- Salas Eléctricas -->
    <button
        type="button"
        class="mobile-division-btn"
        [class.active]="isActive('salas_electricas')"
        [style.color]="isActive('salas_electricas') ? '#f26522' : null"
        (click)="navegarSalas()">
        Salas Eléctricas
    </button>

    <!-- Ingeap Servicios -->
    <button
        type="button"
        class="mobile-division-btn"
        [class.active]="!isActive('salas_electricas') && !isActive('agro')"
        [style.color]="!isActive('salas_electricas') && !isActive('agro') ? '#31a5b3' : null"
        (click)="navegarIngeap()">
        Ingeap Servicios
    </button>

    <!-- Ingeap Agro -->
    <button
        type="button"
        class="mobile-division-btn"
        [class.active]="isActive('agro')"
        [style.color]="isActive('agro') ? '#8db331' : null"
        (click)="navegarIngeapAgro()">
        Ingeap Agro
    </button>

    </div>

    <!-- Separador -->
    <div class="border-top-1 surface-border"></div>

    <!-- Enlaces dinámicos del menú móvil -->
    <div class="flex flex-column gap-2">

        <a
            *ngFor="let item of menuActual"
            (click)="navigateToMenuItem(item)"
            class="cursor-pointer text-700 hover:text-900 font-medium p-2 border-round hover:surface-100 text-decoration-none">

            {{ item.label }}

        </a>

    </div>

</div>
